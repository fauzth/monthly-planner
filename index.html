<!doctype html>
<html lang="id">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10b981" />
    <meta
      name="description"
      content="Monthly Planner: aplikasi planner keuangan bulanan dengan sistem pocket."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Monthly Planner" />
    <meta
      property="og:description"
      content="Atur gaji bulanan lewat pocket: catat pengeluaran, pantau sisa saldo, lihat history."
    />
    <meta
      property="og:image"
      content="https://monthly-planner-one.vercel.app/og-image.png?v=2"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Monthly Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
